# punch.trade — project metadata + tooling configuration.
# Runtime dependencies are declared here AND pinned in backend/requirements.txt
# (the canonical install mechanism). Bump VERSION together with
# backend/app/version.py — the two must never drift.
[project]
name = "punch-trade"
version = "0.4.0"
description = "Self-hosted quantitative trading research, risk and broker-execution workstation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "kiteconnect[ws]>=5.2",
    "ccxt>=4.2",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/app/proxy.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]