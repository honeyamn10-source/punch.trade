<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>PUNCH NEXUS</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages.css">
  <script src="/static/js/formatting.js" defer></script>
  <script src="/static/js/store.js" defer></script>
  <script src="/static/js/api.js" defer></script>
  <script src="/static/js/websocket.js" defer></script>
  <script src="/static/js/router.js" defer></script>
  <script src="/static/js/charts/charts.js" defer></script>
  <script src="/static/js/pages/pages.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <div class="nexus-app">

    <!-- ============================================================
         GLOBAL HUD
    ============================================================ -->
    <header class="global-hud">
      <div class="hud-left">
        <span class="brand">PUNCH<span class="brand-accent">NEXUS</span></span>
        <span class="mode-badge paper" id="modeLabel">PAPER</span>
      </div>
      <div class="hud-center">
        <span class="workspace-title" id="workspaceTitle">NEXUS HOME</span>
      </div>
      <div class="hud-right">
        <div class="status-cluster">
          <span class="status-item">
            <span class="status-dot on" id="connDot"></span>
            <span id="connText">connecting</span>
          </span>
          <span class="status-item mono" id="hudWsLatency">ws: —</span>
          <span class="status-item mono" id="hudClock">--:--:--</span>
        </div>
      </div>
    </header>

    <!-- ============================================================
         NAV RAIL
    ============================================================ -->
    <nav class="nav-rail" id="navRail">
      <button class="nav-item" data-page="nexus" data-tip="Nexus Home">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>
        </svg>
        <span class="nav-label">NEXUS</span>
      </button>

      <button class="nav-item" data-page="signals" data-tip="Live Signals">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>
        </svg>
        <span class="nav-label">SIGNALS</span>
      </button>

      <button class="nav-item" data-page="positions" data-tip="Positions">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="7" width="6" height="12" rx="1"/><rect x="10.5" y="4" width="6" height="15" rx="1"/><rect x="18" y="9" width="3" height="10" rx="1"/>
        </svg>
        <span class="nav-label">POSITIONS</span>
      </button>

      <button class="nav-item" data-page="lab" data-tip="Strategy Lab">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 3h6M10 3v6.5L4.5 19a2 2 0 001.8 3h11.4a2 2 0 001.8-3L14 9.5V3"/>
        </svg>
        <span class="nav-label">LAB</span>
      </button>

      <button class="nav-item" data-page="scenario" data-tip="Scenario Lab">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18.4 5.6l-2.1 2.1M21 12h-3M12 18v3M5.6 18.4l2.1-2.1M18.4 18.4l-2.1-2.1"/><circle cx="12" cy="12" r="3.5"/>
        </svg>
        <span class="nav-label">SCENARIOS</span>
      </button>

      <button class="nav-item" data-page="execution" data-tip="Execution Deck">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 12h4l2-5 3 10 2-5h5"/>
        </svg>
        <span class="nav-label">EXECUTION</span>
      </button>

      <button class="nav-item" data-page="risk" data-tip="Risk Shield">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 3l8 3v6c0 4.5-3.2 7.7-8 9-4.8-1.3-8-4.5-8-9V6l8-3z"/>
        </svg>
        <span class="nav-label">RISK</span>
      </button>

      <button class="nav-item" data-page="system" data-tip="System">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
        </svg>
        <span class="nav-label">SYSTEM</span>
      </button>

      <div class="nav-spacer"></div>

      <button class="nav-item" data-page="settings" data-tip="Settings">
        <svg viewBox="0 0 24 24" class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1.1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1.1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34h.09a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87v.09a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/>
        </svg>
        <span class="nav-label">SETTINGS</span>
      </button>
    </nav>

    <!-- ============================================================
         MAIN WORKSPACE
    ============================================================ -->
    <main class="main-workspace" id="workspace">
      <div class="workspace-content" id="workspaceContent">
        <div class="empty-state">
          <span class="spinner"></span>
          <span class="empty-state-title">Loading NEXUS...</span>
          <span class="empty-state-text">Initializing command center</span>
        </div>
      </div>
    </main>

    <!-- ============================================================
         CONTEXT PANEL
    ============================================================ -->
    <aside class="context-panel" id="contextPanel">
      <div class="context-section">
        <div class="context-title">Providers</div>
        <div class="provider-list" id="providerStatus">
          <div class="status-item"><span class="status-dot warn"></span><span>checking...</span></div>
        </div>
      </div>

      <div class="context-section">
        <div class="context-title">Risk</div>
        <div class="risk-meter">
          <div class="risk-bar"><div class="risk-fill" id="riskFill" style="width: 0%"></div></div>
          <div class="risk-label mono" id="riskLabel">0%</div>
        </div>
      </div>

      <div class="context-section">
        <div class="context-title">API Token</div>
        <div class="form-group">
          <input type="password" id="tokenInput" class="form-input mono" placeholder="X-Punch-Token" autocomplete="off">
          <button id="saveToken" class="btn btn-sm">Save</button>
          <span class="form-hint">Stored locally in your browser only.</span>
        </div>
      </div>

      <div class="context-section">
        <div class="context-title">Quick Nav</div>
        <div class="quick-nav">
          <button class="nav-item" data-page="nexus">Nexus Home</button>
          <button class="nav-item" data-page="signals">Live Signals</button>
          <button class="nav-item" data-page="positions">Positions</button>
          <button class="nav-item" data-page="lab">Strategy Lab</button>
          <button class="nav-item" data-page="scenario">Scenario Lab</button>
          <button class="nav-item" data-page="execution">Execution Deck</button>
          <button class="nav-item" data-page="risk">Risk Shield</button>
          <button class="nav-item" data-page="system">System</button>
          <button class="nav-item" data-page="settings">Settings</button>
        </div>
      </div>
    </aside>

    <!-- ============================================================
         EXECUTION TAPE (bottom)
    ============================================================ -->
    <aside class="execution-tape" id="executionTape">
      <div class="tape-filter">
        <button class="tape-filter-btn active" data-filter="">ALL</button>
        <button class="tape-filter-btn" data-filter="signal">SIG</button>
        <button class="tape-filter-btn" data-filter="fill">FILL</button>
        <button class="tape-filter-btn" data-filter="order">ORD</button>
        <button class="tape-filter-btn" data-filter="system">SYS</button>
      </div>
      <div class="tape-entries" id="tapeEntries">
        <div class="empty-state-text">Waiting for events...</div>
      </div>
    </aside>

    <!-- ============================================================
         COMMAND PALETTE (Ctrl+K)
    ============================================================ -->
    <div class="command-palette" id="commandPalette">
      <div class="palette-box">
        <input type="text" id="commandInput" class="palette-input mono" placeholder="Type a command...">
        <div class="palette-results" id="paletteResults"></div>
      </div>
    </div>

    <!-- ============================================================
         TOASTS
    ============================================================ -->
    <div class="toast-container" id="toastContainer"></div>
  </div>
</body>
</html>
