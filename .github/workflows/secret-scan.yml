name: Secret scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "secret-scan-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  envguard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install pinned envguard
        run: python -m pip install "git+https://github.com/honeyamn10-source/envguard.git@bbde8dff0db6ce67bb4b4945c27ebb5dc55e9f18"

      - name: Scan for committed secrets
        run: envguard scan . --severity critical,high --format json
