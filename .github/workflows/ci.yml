name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Unit tests
        run: python -m pytest backend/tests -q
        working-directory: backend

      - name: Boot server + API smoke test
        run: |
          python run.py &
          SERVER_PID=$!
          sleep 8
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS "http://127.0.0.1:8000/api/strategies?token=punch-demo-token" | head -c 120
          echo
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"broker":"paper","interval":"5m","days":30}' \
            "http://127.0.0.1:8000/api/strategies/rsi-reversal/backtest?token=punch-demo-token"
          echo
          kill $SERVER_PID
        working-directory: backend