name: Close stale issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: "This issue has been inactive for 60 days and will be closed if no further activity occurs."
          stale-pr-message: "This pull request has been inactive for 60 days and will be closed if no further activity occurs."
          close-issue-message: "Closing this issue because it has been inactive. Please reopen if the problem persists."
          close-pr-message: "Closing this pull request because it has been inactive. Please reopen if you want to continue it."
          exempt-issue-labels: "pinned,security,bug"
          exempt-pr-labels: "dependencies"
          exempt-draft-pr: true